name: validate

# Action SHAs were resolved with `gh api repos/<owner>/<repo>/commits/<tag>` on 2026-10-02.
# To update: resolve the new tag the same way and keep the tag in the trailing comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: sync, validate, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run scripts/test.py (sync --check, validate, unittest)
        run: python3 scripts/test.py -v
      - name: Build the distribution ZIPs
        run: python3 scripts/build_dist.py

  claude-plugin-validate:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the Claude Code CLI (pinned; no credentials needed to validate)
        run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.282
      - name: Validate the marketplace and the plugin manifest
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
